services:
  postgres:
    image: postgres:16-alpine
    container_name: ultimate-router-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ultimate_router
      POSTGRES_USER: ultimate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ultimate_router_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultimate -d ultimate_router"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ultimate_router_pgdata:
